name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Test, Build & Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test -w floodgate-rl

      - name: Typecheck
        run: |
          npm run typecheck -w floodgate-rl
          npm run typecheck -w floodgate-express
          npm run typecheck -w floodgate-nextjs

      - name: Build core
        run: npm run build -w floodgate-rl

      - name: Build express adapter
        run: npm run build -w floodgate-express

      - name: Build nextjs adapter
        run: npm run build -w floodgate-nextjs

      - name: Publish core
        run: npm publish -w packages/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish express adapter
        run: npm publish -w packages/express --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish nextjs adapter
        run: npm publish -w packages/nextjs --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
