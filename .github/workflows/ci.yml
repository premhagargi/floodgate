name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (core)
        run: npm run typecheck -w floodgate-rl

      - name: Test (core)
        run: npm run test -w floodgate-rl

      - name: Build (core)
        run: npm run build -w floodgate-rl

      - name: Build (express middleware)
        run: npm run build -w floodgate-express

      - name: Build (nextjs middleware)
        run: npm run build -w floodgate-nextjs
